<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnityGraph Observatory</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/observatory.css">
</head>
<body>
  <!-- Starfield backdrop -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Radial vignette -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Top-left title + project crumb -->
  <header class="title-bar">
    <div class="mark">
      <span class="mark-dot"></span>
      <span class="mark-word">Observatory</span>
    </div>
    <h1 class="title">
      <span class="title-eyebrow">UnityGraph</span>
      <span class="title-main" id="project-name">loading...</span>
    </h1>
    <div class="stats" id="stats"></div>
  </header>

  <!-- Top-right control cluster -->
  <aside class="control-panel">
    <div class="connection" id="connection">
      <span class="connection-dot"></span>
      <span class="connection-label">connecting</span>
    </div>
    <details class="legend" open>
      <summary>node types</summary>
      <ul id="legend-list"></ul>
    </details>
    <details class="filters" open>
      <summary>scope</summary>
      <label class="switch">
        <input type="radio" name="scope" id="scope-user" value="user" checked>
        <span>user scripts + neighbors</span>
      </label>
      <label class="switch">
        <input type="radio" name="scope" id="scope-all" value="all">
        <span>full graph (slow on big projects)</span>
      </label>
      <p class="filter-note" id="scope-note"></p>
    </details>
    <details class="filters">
      <summary>filters</summary>
      <label class="switch">
        <input type="checkbox" id="filter-orphans">
        <span>hide orphan nodes</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="filter-external">
        <span>hide external scripts</span>
      </label>
    </details>
    <button class="icon-btn" id="btn-recenter" title="recenter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>
      </svg>
    </button>
  </aside>

  <!-- Bottom-left search -->
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input type="text" id="search" placeholder="search nodes..." autocomplete="off" spellcheck="false">
  </div>

  <!-- Graph canvas -->
  <div id="graph"></div>

  <!-- Node detail card (floats, positioned on click) -->
  <div class="detail-card" id="detail" hidden>
    <span class="detail-accent" aria-hidden="true"></span>
    <header>
      <span class="detail-type" id="detail-type"></span>
      <h2 id="detail-name"></h2>
      <button class="detail-close" id="detail-close" title="close">×</button>
    </header>
    <dl id="detail-body"></dl>
  </div>

  <!-- Change toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- Scripts: react-force-graph-2d bundled via unpkg as a UMD global -->
  <script src="https://unpkg.com/d3-quadtree@3/dist/d3-quadtree.min.js"></script>
  <script src="https://unpkg.com/d3-dispatch@3/dist/d3-dispatch.min.js"></script>
  <script src="https://unpkg.com/d3-timer@3/dist/d3-timer.min.js"></script>
  <script src="https://unpkg.com/d3-binarytree@1/dist/d3-binarytree.min.js"></script>
  <script src="https://unpkg.com/d3-octree@1/dist/d3-octree.min.js"></script>
  <script src="https://unpkg.com/d3-force-3d@3/dist/d3-force-3d.min.js"></script>
  <script src="https://unpkg.com/force-graph@1/dist/force-graph.min.js"></script>
  <script src="/assets/observatory.js"></script>
</body>
</html>
